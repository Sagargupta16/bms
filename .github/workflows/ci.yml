name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # Hash-locked, wheels only: a source distribution runs its build script at install time.
      # Regenerate the lock with the command in its header after editing requirements*.txt.
      - name: Install dependencies
        run: "pip install --require-hashes --only-binary :all: -r requirements-dev.lock.txt"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
